<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FindToilet — Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="assets/style.css?v=10" />
  <link rel="icon" type="image/png" href="assets/favicon.png?v=10" />
</head>
<body class="map-page">
  <header class="site-header map-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">
        <img class="logo-img" src="assets/logo.png?v=10" alt="FindToilet — Find Toilet in Europe" />
      </a>
      <nav class="site-nav">
        <a href="index.html" data-i18n="nav.allCities">← All cities</a>
        <div class="lang-switcher">
          <button class="lang-btn" id="lang-btn" aria-label="Language" aria-haspopup="true" aria-expanded="false">
            <img src="assets/lang-mark.png" alt="" />
          </button>
          <div class="lang-menu" id="lang-menu" role="menu"></div>
        </div>
      </nav>
    </div>
  </header>

  <div class="map-toolbar">
    <div class="map-title">
      <span class="map-city" id="map-city">Loading…</span>
      <span class="map-count" id="map-count"></span>
    </div>
    <button id="locate-btn" class="locate-btn" data-i18n="locate">📍 Near me</button>
    <div class="legend">
      <span class="legend-item"><i class="dot dot-free"></i><span data-i18n="legend.free">Free</span></span>
      <span class="legend-item"><i class="dot dot-paid"></i><span data-i18n="legend.paid">Paid</span></span>
      <span class="legend-item"><i class="dot dot-unknown"></i><span data-i18n="legend.unknown">Unknown</span></span>
      <span class="legend-item"><i class="dot dot-code"></i><span data-i18n="legend.code">Door code</span></span>
    </div>
  </div>

  <div class="map-main">
    <aside id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title" id="sidebar-title"></span>
        <button class="sort-btn" id="sort-distance" data-i18n="list.sort">Sort by distance</button>
        <button class="sidebar-close" id="sidebar-close" aria-label="Close">✕</button>
      </div>
      <div class="filter-row" id="filter-row">
        <button class="chip active" data-filter="all"><span data-i18n="filter.all">All</span></button>
        <button class="chip" data-filter="free"><span data-i18n="legend.free">Free</span></button>
        <button class="chip" data-filter="paid"><span data-i18n="legend.paid">Paid</span></button>
        <button class="chip" data-filter="wheelchair">♿ <span data-i18n="filter.wheelchair">Wheelchair</span></button>
        <button class="chip" data-filter="code">🔑 <span data-i18n="legend.code">Door code</span></button>
      </div>
      <div id="toilet-list"></div>
    </aside>
    <div id="map"></div>
    <button id="list-fab"><span id="list-fab-label">☰ List</span></button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="assets/lang-switcher.js"></script>
  <script src="assets/map.js"></script>
</body>
</html>
